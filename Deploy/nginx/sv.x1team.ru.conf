# =============================================================================
#  Nginx: WebSocket-прокси на выделенный сервер Unity (Mirror SimpleWebTransport)
#  Куда класть:  /etc/nginx/sites-available/sv.x1team.ru
#                /etc/nginx/sites-enabled/sv.x1team.ru   (симлинк)
#
#  ПЕРЕД установкой обязательно найдите, где sv.x1team.ru описан сейчас:
#     sudo grep -rn "sv.x1team.ru" /etc/nginx/sites-available/ /etc/nginx/conf.d/ /etc/nginx/nginx.conf
#  Если блок `server { server_name sv.x1team.ru; ... }` уже есть внутри другого файла
#  (например, рядом с Django в /etc/nginx/sites-available/x1team), НЕ копируйте этот
#  файл целиком: получатся два server-блока с одним именем, и nginx возьмёт первый
#  попавшийся. Перенесите в существующий блок только настройки проксирования.
#
#  Применение, если отдельного файла нет:
#     sudo cp Deploy/nginx/sv.x1team.ru.conf /etc/nginx/sites-available/sv.x1team.ru
#     sudo ln -sf /etc/nginx/sites-available/sv.x1team.ru /etc/nginx/sites-enabled/sv.x1team.ru
#     sudo nginx -t && sudo systemctl reload nginx
#
#  ЧТО ИЗМЕНЕНО И ПОЧЕМУ
#
#  1. proxy_read_timeout 7d -> 600s
#     Неделя ожидания держит на сервере «полумёртвые» соединения: браузер уже закрыл
#     вкладку, а nginx не закрывает upstream, и Unity продолжает считать клиента
#     подключённым. Живое соединение Mirror никогда не молчит: клиент шлёт
#     TimeSnapshotMessage каждые 100 мс, поэтому 600 с — это огромный запас,
#     а мёртвое соединение будет убрано за 10 минут вместо недели.
#
#  2. proxy_buffering off / gzip off / tcp_nodelay on
#     Игра — это поток мелких пакетов. Любая буферизация или сжатие на прокси
#     добавляет задержку и может «слипать» сообщения.
#
#  3. proxy_socket_keepalive on
#     TCP keepalive на соединении nginx -> Unity: ядро само заметит оборванное
#     upstream-соединение, а не будет ждать таймаута чтения.
#
#  4. proxy_request_buffering off
#     Не буферизовать тело запроса — для туннелированного WebSocket это не нужно.
#
#  5. Ограничение числа одновременных подключений на одного клиента (limit_conn) —
#     закомментировано, включайте осознанно: за NAT одного офиса/школы может сидеть
#     много игроков с одним внешним IP.
#
#  6. ВАЖНО: НЕ добавляйте http2 в listen этого server-блока.
#     Механизм Upgrade: websocket работает по HTTP/1.1. С http2 часть браузеров
#     попытается открыть WebSocket по-своему и не подключится.
#
#  7. Блок map должен встречаться в конфигурации ОДИН РАЗ (он живёт в контексте http).
#     Если nginx -t ругается на "duplicate map" — удалите второй экземпляр.
# =============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Опционально: лимит соединений на один IP -------------------------------
# limit_conn_zone $binary_remote_addr zone=x1game_conn:10m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # НЕ добавлять http2: WebSocket требует HTTP/1.1.
    server_name sv.x1team.ru;

    ssl_certificate     /etc/letsencrypt/live/sv.x1team.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sv.x1team.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/x1game.access.log;
    error_log  /var/log/nginx/x1game.error.log warn;

    location / {
        # limit_conn x1game_conn 8;

        proxy_pass http://127.0.0.1:27777;

        # --- WebSocket ---
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # --- Идентификация клиента ---
        # X-Forwarded-For обязателен: Mirror (Connection.CalculateAddress) берёт
        # реальный IP игрока именно из него. Без этого все игроки будут выглядеть
        # как 127.0.0.1, и в логе сервера будет невозможно разобрать, кто есть кто.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- Потоковый режим: никакой буферизации и сжатия ---
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_cache             off;
        gzip                    off;
        tcp_nodelay             on;
        proxy_socket_keepalive  on;

        # --- Таймауты ---
        # connect — сколько ждать установки соединения с Unity (5 с достаточно:
        # если сервер не слушает, клиент должен получить 502 быстро, а не висеть).
        # read/send — сколько держать соединение без трафика. Mirror шлёт пакеты
        # каждые 100 мс, поэтому 600 с — это запас на любой лаг клиента.
        proxy_connect_timeout 5s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # --- Опционально: публичная проверка живости сервера ---------------------
    # Открывать наружу не обязательно: внешний сторож ходит на 127.0.0.1:8084 напрямую.
    # location = /healthz {
    #     proxy_pass http://127.0.0.1:8084/health;
    #     proxy_http_version 1.1;
    #     proxy_set_header Connection "";
    #     proxy_connect_timeout 3s;
    #     proxy_read_timeout    5s;
    #     access_log off;
    # }
}

server {
    listen 80;
    listen [::]:80;
    server_name sv.x1team.ru;

    # certbot проверяет домен по HTTP, поэтому ACME-запросы не редиректим.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
